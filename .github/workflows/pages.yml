name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege: nothing beyond read by default; only the deploy job can publish
permissions:
  contents: read

# one deploy at a time, and never cancel a deploy that's already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to exact commits (tags can be moved); Dependabot keeps them current
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # sample scores until the trial team enters real ratings -- switch back to
      # `npm run build` then (data/trials.mock.json vs data/trials.json)
      - run: npm run build:mock
        env:
          # repo name, so links work at username.github.io/repo-name/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
